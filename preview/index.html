<script>
  // ─── Supabase client ──────────────────────────────────────
  const SUPABASE_URL  = 'https://lmnmrrwnqagveddyvpnz.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxtbm1ycnducWFndmVkZHl2cG56Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMTU5NTYsImV4cCI6MjA5Mzc5MTk1Nn0.uxasf8ym9BK7kSBIM9RRfDXwjGUCVIJ6fmtDUnXpfdY';

  function checkTrueLogin() {
    const tokenStr = localStorage.getItem('sb-lmnmrrwnqagveddyvpnz-auth-token');
    if (!tokenStr) return false;
    try {
      const tokenData = JSON.parse(tokenStr);
      return !!(tokenData && tokenData.access_token);
    } catch (e) { return false; }
  }

  // ─── Auto-save after login redirect ──────────────────────
  document.addEventListener('DOMContentLoaded', function() {
    // Inject Save Button into page immediately
    injectSaveButton();

    // Auto-trigger save if came back from login
    const checkInterval = setInterval(function() {
      const isPendingSave = localStorage.getItem('pendingSaveReceipt') === 'true';
      if (checkTrueLogin() && isPendingSave) {
        const isHydrated = !document.body.textContent.includes('Loading Preview...');
        if (isHydrated) {
          clearInterval(checkInterval);
          // Find the original React save button and click it OR use our own
          const reactSaveBtn = Array.from(document.querySelectorAll('button')).find(b =>
            b.textContent.trim().toLowerCase().includes('save receipt') && b.id !== 'rm-save-btn'
          );
          if (reactSaveBtn) {
            localStorage.removeItem('pendingSaveReceipt');
            setTimeout(() => reactSaveBtn.click(), 300);
          } else {
            // Use our own save button logic
            setTimeout(() => performSave(), 500);
          }
        }
      }
    }, 300);
  });

  // Keep button injected by checking every 200ms (more reliable than MutationObserver with Next.js body replacing)
  setInterval(injectSaveButton, 200);

  function injectSaveButton() {
    if (document.getElementById('rm-save-btn-wrap')) return;

    // Button wrapper
    const wrap = document.createElement('div');
    wrap.id = 'rm-save-btn-wrap';

    wrap.innerHTML = `
      <button id="rm-save-btn" aria-label="Save Receipt to Dashboard">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
        </svg>
        <span id="rm-btn-text">Save Receipt</span>
        <div id="rm-btn-spinner"></div>
      </button>
    `;

    // Toast
    let toast = document.getElementById('rm-toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'rm-toast';
      toast.innerHTML = `
        <svg class="toast-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" id="rm-toast-icon">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
        </svg>
        <span id="rm-toast-msg">Receipt saved to dashboard!</span>
      `;
      document.body.appendChild(toast);
    }

    document.body.appendChild(wrap);

    // Bind event listener immediately
    document.getElementById('rm-save-btn').addEventListener('click', handleSaveClick);
  }

  async function handleSaveClick() {
    if (!checkTrueLogin()) {
      // Not logged in — mark pending save and redirect to login
      localStorage.setItem('pendingSaveReceipt', 'true');
      showToast('Please login to save your receipt...', false);
      setTimeout(() => { window.location.href = '/login/'; }, 1000);
      return;
    }
    await performSave();
  }

  async function performSave() {
    const btn     = document.getElementById('rm-save-btn');
    const btnText = document.getElementById('rm-btn-text');
    const spinner = document.getElementById('rm-btn-spinner');
    if (!btn) return;

    // First try to find and click the original React save button
    const reactSaveBtns = Array.from(document.querySelectorAll('button')).filter(b =>
      b.textContent.trim().toLowerCase().includes('save') &&
      b.id !== 'rm-save-btn' &&
      b.offsetParent !== null
    );

    if (reactSaveBtns.length > 0) {
      btn.disabled = true;
      btnText.textContent = 'Saving...';
      spinner.style.display = 'block';

      reactSaveBtns[0].click();
      localStorage.removeItem('pendingSaveReceipt');

      setTimeout(() => {
        btn.disabled = false;
        btnText.textContent = 'Saved ✓';
        spinner.style.display = 'none';
        showToast('Receipt saved to your dashboard!', true);
        setTimeout(() => { btnText.textContent = 'Save Receipt'; }, 3000);
      }, 1200);
      return;
    }

    // Fallback: save receipt data from localStorage directly
    btn.disabled = true;
    btnText.textContent = 'Saving...';
    spinner.style.display = 'block';

    try {
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
      const { data: { session } } = await supabase.auth.getSession();

      if (!session) {
        localStorage.setItem('pendingSaveReceipt', 'true');
        window.location.href = '/login/';
        return;
      }

      // Collect receipt data from localStorage
      const receiptData = localStorage.getItem('currentReceiptData') || localStorage.getItem('receiptData') || '{}';

      const { error } = await supabase.from('receipts').insert([{
        user_id: session.user.id,
        data: JSON.parse(receiptData),
        created_at: new Date().toISOString()
      }]);

      localStorage.removeItem('pendingSaveReceipt');

      if (error) {
        showToast('Could not save. Please try again.', false);
      } else {
        btnText.textContent = 'Saved ✓';
        showToast('Receipt saved to your dashboard!', true);
        setTimeout(() => { btnText.textContent = 'Save Receipt'; }, 3000);
      }
    } catch (err) {
      showToast('Error saving receipt. Please try again.', false);
    } finally {
      btn.disabled = false;
      spinner.style.display = 'none';
    }
  }

  function showToast(msg, isSuccess) {
    const toast = document.getElementById('rm-toast');
    if (!toast) return;
    const icon  = document.getElementById('rm-toast-icon');
    const msgEl = document.getElementById('rm-toast-msg');

    msgEl.textContent = msg;
    toast.className = 'visible ' + (isSuccess ? 'ok' : 'err');

    if (icon) {
      icon.innerHTML = isSuccess
        ? '<path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>'
        : '<circle cx="12" cy="12" r="10"/><path stroke-linecap="round" d="M12 8v4m0 4h.01"/>';
    }

    setTimeout(() => { if (toast) toast.className = ''; }, 3500);
  }
</script>
